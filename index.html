<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PremierAI</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-sidebar: #131b2e;
            --bg-card: #1a233a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2a3756;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 99;
        }
        .overlay.active { display: block; }

        aside {
            position: fixed;
            top: 0; bottom: 0; left: -280px;
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 14px;
            gap: 12px;
            z-index: 100;
            transition: left 0.25s ease;
        }
        aside.open { left: 0; }

        .brand-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
        }

        .btn-close-menu {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            padding: 4px 8px;
        }

        .btn-new-chat {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item.active {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        .stats-box {
            background: var(--bg-card);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }
        .stat-value { color: var(--text-main); font-weight: 600; }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 100%;
        }

        main {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-sidebar);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-menu {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 4px;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 90%;
            padding: 12px 14px;
            border-radius: 12px;
            line-height: 1.4;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .message.user {
            background-color: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message pre {
            background: #000;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 8px;
        }

        .message code {
            font-family: monospace;
            font-size: 0.8rem;
        }

        .input-area {
            padding: 10px 12px;
            background-color: var(--bg-sidebar);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            resize: none;
            height: 44px;
            max-height: 100px;
            font-size: 16px;
            outline: none;
        }

        textarea:focus { border-color: var(--accent); }

        .btn-send {
            background-color: var(--accent);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-send:disabled {
            background-color: var(--border);
            color: var(--text-muted);
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 8px 12px;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside id="sidebar">
        <div class="brand-row">
            <div class="brand">⚡ PremierAI</div>
            <button class="btn-close-menu" onclick="toggleMenu()">✕</button>
        </div>
        <button class="btn-new-chat" onclick="createNewChat()">+ Новый чат</button>
        <div class="chat-list" id="chatList"></div>

        <div class="stats-box">
            <div class="stat-row">
                <span>Лимит на сегодня:</span>
                <span class="stat-value" id="limitCount">10 / 10</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="stat-row">
                <span>Токены:</span>
                <span class="stat-value" id="tokenCount">0</span>
            </div>
            <div class="stat-row" style="font-size: 0.75rem; color: var(--text-muted);">
                Сброс через: <span id="resetTimer">24:00:00</span>
            </div>
        </div>
    </aside>

    <main>
        <header>
            <button class="btn-menu" onclick="toggleMenu()">☰</button>
            <div class="header-title" id="currentChatTitle">Новый чат</div>
        </header>

        <div class="error-banner" id="errorBanner">Лимит запросов исчерпан!</div>

        <div class="chat-container" id="chatContainer">
            <div class="message assistant">Привет! Я готов. Задавай вопрос по коду или проекту.</div>
        </div>

        <div class="input-area">
            <textarea id="userInput" placeholder="Сообщение..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </main>

    <script>
        const API_KEY = ["gsk_", "EFpeESRcNNCLBk4ExDf1WGdyb3FYq2lcg13Vf5XP3Z6sve2u5FHF"].join("");
        const MODEL = "openai/gpt-oss-20b";

        let chats = JSON.parse(localStorage.getItem('premier_ai_chats')) || [{ id: Date.now(), title: 'Новый чат', messages: [] }];
        let currentChatId = chats[0].id;
        let sessionTokens = 0;
        let usageData = JSON.parse(localStorage.getItem('premier_ai_usage')) || { count: 0, resetTime: Date.now() + 86400000 };

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function checkLimitReset() {
            if (Date.now() > usageData.resetTime) {
                usageData = { count: 0, resetTime: Date.now() + 86400000 };
                localStorage.setItem('premier_ai_usage', JSON.stringify(usageData));
            }
        }

        function updateUIStats() {
            checkLimitReset();
            const remaining = 10 - usageData.count;
            document.getElementById('limitCount').innerText = `${remaining} / 10`;
            document.getElementById('progressFill').style.width = `${(remaining / 10) * 100}%`;
            document.getElementById('tokenCount').innerText = sessionTokens;

            const sendBtn = document.getElementById('sendBtn');
            const errorBanner = document.getElementById('errorBanner');
            const textarea = document.getElementById('userInput');

            if (remaining <= 0) {
                sendBtn.disabled = true;
                textarea.disabled = true;
                errorBanner.style.display = 'block';
            } else {
                sendBtn.disabled = false;
                textarea.disabled = false;
                errorBanner.style.display = 'none';
            }
        }

        setInterval(() => {
            const diff = usageData.resetTime - Date.now();
            if (diff <= 0) { updateUIStats(); return; }
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('resetTimer').innerText =
                `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }, 1000);

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.innerText = chat.title;
                div.onclick = () => { currentChatId = chat.id; renderChatList(); renderMessages(); toggleMenu(); };
                list.appendChild(div);
            });
        }

        function createNewChat() {
            const newChat = { id: Date.now(), title: 'Новый чат', messages: [] };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            localStorage.setItem('premier_ai_chats', JSON.stringify(chats));
            renderChatList();
            renderMessages();
            toggleMenu();
        }

        function renderMessages() {
            const container = document.getElementById('chatContainer');
            const currentChat = chats.find(c => c.id === currentChatId);
            document.getElementById('currentChatTitle').innerText = currentChat.title;

            container.innerHTML = '<div class="message assistant">Привет! Я готов. Задавай вопрос по коду или проекту.</div>';

            currentChat.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                div.innerHTML = msg.content.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            checkLimitReset();
            if (10 - usageData.count <= 0) return;

            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            const currentChat = chats.find(c => c.id === currentChatId);
            if (currentChat.messages.length === 0) {
                currentChat.title = text.length > 20 ? text.substring(0, 20) + '...' : text;
            }

            currentChat.messages.push({ role: 'user', content: text });
            localStorage.setItem('premier_ai_chats', JSON.stringify(chats));
            renderChatList();
            renderMessages();

            usageData.count++;
            localStorage.setItem('premier_ai_usage', JSON.stringify(usageData));
            updateUIStats();

            const apiMessages = [
                { role: "system", content: "Ты личный ИИ-ассистент разработчика. Отвечай четко, помогай с кодом (C++, Lua, JS, Android)." },
                ...currentChat.messages.map(m => ({ role: m.role, content: m.content }))
            ];

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: apiMessages,
                        max_tokens: 1000
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const reply = data.choices && data.choices[0] ? data.choices[0].message.content : "Пустой ответ.";
                if (data.usage) { sessionTokens += data.usage.total_tokens || 10; updateUIStats(); }

                currentChat.messages.push({ role: 'assistant', content: reply });
                localStorage.setItem('premier_ai_chats', JSON.stringify(chats));
                renderChatList();
                renderMessages();
            } catch (err) {
                currentChat.messages.push({ role: 'assistant', content: `❌ Ошибка: ${err.message}` });
                renderMessages();
            }
        }

        updateUIStats();
        renderChatList();
        renderMessages();
    </script>
</body>
</html>
